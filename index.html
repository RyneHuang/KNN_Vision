<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN算法可视化教学演示系统</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .main-canvas {
            flex: 0 0 70%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .control-panel {
            flex: 0 0 30%;
            background: #fff;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .control-group select,
        .control-group input[type="range"],
        .control-group input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #k-value-display {
            color: #2196F3;
            font-weight: bold;
        }

        #prediction-details {
            font-size: 14px;
            line-height: 1.6;
        }

        #data-table-container {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        #data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        #data-table th, #data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        #data-table th {
            background: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        #data-table tr:nth-child(even) {
            background: #fafafa;
        }

        .label-0 { color: #2196F3; }
        .label-1 { color: #4CAF50; }
        .label-2 { color: #FF9800; }

        .feature-select-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .feature-select-group select {
            flex: 1;
        }

        /* 手动输入区域 */
        #manual-input-container {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        #manual-input-container h4 {
            margin-bottom: 12px;
            color: #333;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .input-row label {
            min-width: 80px;
            margin-bottom: 0;
        }

        .input-row input {
            flex: 1;
        }

        #predict-btn {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #predict-btn:hover {
            background: #45a049;
        }

        #distance-result {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.8;
            max-height: 400px;
            overflow-y: auto;
        }

        #distance-result table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }

        #distance-result th, #distance-result td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }

        #distance-result th {
            background: #f5f5f5;
            font-weight: 600;
        }

        #distance-result .rank-1 { background: #ffd700; font-weight: bold; }
        #distance-result .rank-2 { background: #c0c0c0; }
        #distance-result .rank-3 { background: #cd7f32; }

        .final-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        .final-result.apple {
            background: #ffcccc;
            color: #c41e3a;
        }

        .final-result.banana {
            background: #fffacd;
            color: #8b8000;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            .main-canvas {
                flex: none;
                height: 50vh;
            }
            .control-panel {
                flex: none;
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧主画布区域 (70%) -->

                <h4 style="margin-bottom: 10px;">数据集详情</h4>

                        <thead id="data-table-head"></thead>
                        <tbody id="data-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- 右侧控制面板 (30%) -->
        <div class="control-panel">
            <h2>KNN 算法演示</h2>
            <!-- 数据集选择 -->
            <div class="control-group">
                <label>数据集</label>

                    <option value="breast-cancer">乳腺癌诊断数据集</option>

                <label>选择可视化特征</label>
                <div class="feature-select-group">
                    <span>X轴特征:</span>
                    <select id="feature-x-select"></select>
                </div>
                <div class="feature-select-group" style="margin-top: 8px;">
                    <span>Y轴特征:</span>
                    <select id="feature-y-select"></select>
                </div>
            </div>
            <!-- 归一化开关 -->
            <div class="control-group">
                <label>启用Min-Max归一化</label>
                <input type="checkbox" id="normalization-toggle">
            </div>
            <!-- K值滑块 -->
            <div class="control-group">
                <label>K值: <span id="k-value-display">5</span></label>
                <input type="range" id="k-slider" min="1" max="30" value="5">
            </div>
            <!-- 手动输入预测 -->
            <div id="manual-input-container">
                <h4>📝 手动输入预测</h4>
                <div class="input-row">
                    <label id="input-x-label">硬度:</label>
                    <input type="number" id="input-x" step="0.1" placeholder="请输入硬度值">
                </div>
                <div class="input-row">
                    <label id="input-y-label">甜度:</label>
                    <input type="number" id="input-y" step="0.1" placeholder="请输入甜度值">
                </div>
                <button id="predict-btn">开始预测</button>
                <div id="distance-result"></div>
            </div>
            <!-- 预测结果 -->
            <div class="control-group" id="prediction-result">
                <h3>预测结果</h3>
                <div id="prediction-details"></div>
                <button id="clear-btn" style="margin-top: 10px; padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">清空待测点</button>
            </div>
            <!-- 教学说明 -->
            <div class="control-group">
                <h3>教学说明</h3>

        </div>
    </div>

// 生成月亮数据集 - 2个特征
function generateMoonsData() {
    const data = [];
    for (let i = 0; i < 50; i++) {
        const angle = Math.PI * (i / 50);
        const r = 1 + Math.random() * 0.3;
        data.push({x: r * Math.cos(angle) + (Math.random() - 0.5) * 0.1, y: r * Math.sin(angle) + (Math.random() - 0.5) * 0.1, label: 0});
    }
    for (let i = 0; i < 50; i++) {
        const angle = Math.PI * (i / 50);
        const r = 1 + Math.random() * 0.3;
        data.push({x: r * Math.cos(angle + Math.PI) + 2 + (Math.random() - 0.5) * 0.1, y: r * Math.sin(angle + Math.PI) + 0.5 + (Math.random() - 0.5) * 0.1, label: 1});
    }
    return data;
}

// 生成同心圆数据集 - 2个特征
function generateCirclesData() {
    const data = [];
    for (let i = 0; i < 50; i++) {
        const angle = 2 * Math.PI * (i / 50);
        const r = 0.5 + Math.random() * 0.2;
        data.push({x: r * Math.cos(angle) + (Math.random() - 0.5) * 0.05, y: r * Math.sin(angle) + (Math.random() - 0.5) * 0.05, label: 0});
    }
    for (let i = 0; i < 50; i++) {
        const angle = 2 * Math.PI * (i / 50);
        const r = 1.5 + Math.random() * 0.3;
        data.push({x: r * Math.cos(angle) + (Math.random() - 0.5) * 0.05, y: r * Math.sin(angle) + (Math.random() - 0.5) * 0.05, label: 1});
    }
    return data;
}

function debounceUpdateVisualization() {
    if (updateTimeout) clearTimeout(updateTimeout);
    updateTimeout = setTimeout(updateVisualization, 100);

// ============ 特征选择功能 ============

function updateFeatureSelectors() {
    const dataset = DATASETS[state.currentDataset];
    const features = dataset.features;
    const featureLabels = dataset.featureLabels;

    const xSelect = document.getElementById('feature-x-select');
    const ySelect = document.getElementById('feature-y-select');

    xSelect.innerHTML = '';
    ySelect.innerHTML = '';

    features.forEach(feature => {
        const label = featureLabels[feature] || feature;
        xSelect.add(new Option(label, feature));
        ySelect.add(new Option(label, feature));
    });

    if (features.includes(state.featureX)) {
        xSelect.value = state.featureX;
    } else {
        xSelect.value = dataset.defaultFeatures[0];
        state.featureX = dataset.defaultFeatures[0];
    }

    if (features.includes(state.featureY)) {
        ySelect.value = state.featureY;
    } else {
        ySelect.value = dataset.defaultFeatures[1] || features[1];
        state.featureY = dataset.defaultFeatures[1] || features[1];
    }

    // 更新手动输入的标签
    document.getElementById('input-x-label').textContent = featureLabels[state.featureX] || state.featureX + ':';
    document.getElementById('input-y-label').textContent = featureLabels[state.featureY] || state.featureY + ':';
}

// ============ 数据表格功能 ============

function updateDataTable() {
    const dataset = DATASETS[state.currentDataset];
    const data = dataset.data;
    const features = dataset.features;
    const featureLabels = dataset.featureLabels;

    const thead = document.getElementById('data-table-head');
    const tbody = document.getElementById('data-table-body');

    let headerHtml = '<tr><th>序号</th>';
    features.forEach(f => {
        headerHtml += `<th>${featureLabels[f] || f}</th>`;
    });
    headerHtml += '<th>类别</th></tr>';
    thead.innerHTML = headerHtml;

    let bodyHtml = '';
    data.forEach((point, index) => {
        bodyHtml += `<tr><td>${index + 1}</td>`;
        features.forEach(f => {
            bodyHtml += `<td>${point[f].toFixed(3)}</td>`;
        });
        const labelName = dataset.labels ? dataset.labels[point.label] : point.label;
        bodyHtml += `<td class="label-${point.label}">${labelName}</td></tr>`;
    });
    tbody.innerHTML = bodyHtml;
}

function getCurrentFeatureData(data, featureX, featureY) {
    return data.map(point => ({
        x: point[featureX],
        y: point[featureY],
        label: point.label,
        _original: point
    }));
}

function minMaxNormalizeSelected(data, featureX, featureY) {
    const xValues = data.map(p => p.x);
    const yValues = data.map(p => p.y);

    const xMin = Math.min(...xValues);
    const xMax = Math.max(...xValues);
    const yMin = Math.min(...yValues);
    const yMax = Math.max(...yValues);

    return data.map(p => ({
        ...p,
        x: (p.x - xMin) / (xMax - xMin || 1),
        y: (p.y - yMin) / (yMax - yMin || 1)
    }));
}

// ============ KNN算法 ============

function euclideanDistance2D(p1, p2) {
    return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
}

function knn_predict(testPoint, trainData, k) {
    const distances = trainData.map(point => ({
        point: point,
        distance: euclideanDistance2D(testPoint, point)
    }));

    distances.sort((a, b) => a.distance - b.distance);

    const kNeighbors = distances.slice(0, k);

    const voteCount = {};
    kNeighbors.forEach(neighbor => {
        const label = neighbor.point.label;
        voteCount[label] = (voteCount[label] || 0) + 1;
    });

    let maxVotes = 0;
    let predictedLabel = 0;
    for (const [label, count] of Object.entries(voteCount)) {
        if (count > maxVotes) {
            maxVotes = count;
            predictedLabel = parseInt(label);
        }
    }

    return {
        label: predictedLabel,
        neighbors: kNeighbors,
        voteCount: voteCount,
        allDistances: distances
    };
}

// ============ 手动预测功能 ============

function handleManualPrediction() {
    const xInput = document.getElementById('input-x').value;
    const yInput = document.getElementById('input-y').value;

    if (xInput === '' || yInput === '' || isNaN(xInput) || isNaN(yInput)) {
        document.getElementById('distance-result').innerHTML = '<p style="color: red;">请输入有效的数值！</p>';
        return;
    }

    const x = parseFloat(xInput);
    const y = parseFloat(yInput);
    const dataset = DATASETS[state.currentDataset];
    const k = state.k;
    const displayK = k + 5;

    // 获取当前特征数据
    const data = getCurrentFeatureData(dataset.data, state.featureX, state.featureY);
    const processedData = state.normalized ? minMaxNormalizeSelected(data, state.featureX, state.featureY) : data;

    // 创建测试点
    const testPoint = { x, y };

    // 进行预测
    const result = knn_predict(testPoint, processedData, displayK);

    const xLabel = dataset.featureLabels[state.featureX] || state.featureX;
    const yLabel = dataset.featureLabels[state.featureY] || state.featureY;
    const labelNames = dataset.labels || ['类别0', '类别1', '类别2'];

    // 显示计算过程
    let html = `<p><strong>📊 距离计算过程</strong></p>`;
    html += `<p><strong>待测点:</strong> (${xLabel}=${x.toFixed(2)}, ${yLabel}=${y.toFixed(2)})</p>`;
    html += `<p><strong>欧氏距离公式:</strong> d = √[(x₁-x₂)² + (y₁-y₂)²]</p>`;
    html += `<p><strong>K值:</strong> ${k}，显示前 ${displayK} 个最近邻居</p>`;
    html += `<p><strong>距离排序结果:</strong></p>`;
    html += `<table>`;
    html += `<tr><th>排名</th><th>样本</th><th>${xLabel}</th><th>${yLabel}</th><th>类别</th><th>距离</th><th>计算过程</th></tr>`;

    result.allDistances.slice(0, displayK).forEach((item, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        const sampleName = labelNames[item.point.label] || `样本${index + 1}`;
        const dx = (testPoint.x - item.point.x).toFixed(4);
        const dy = (testPoint.y - item.point.y).toFixed(4);
        const calc = `√[(${dx})² + (${dy})²] = ${item.distance.toFixed(4)}`;

        html += `<tr class="${rankClass}">
            <td>${rank}</td>
            <td>${sampleName}</td>
            <td>${item.point.x.toFixed(3)}</td>
            <td>${item.point.y.toFixed(3)}</td>
            <td>${sampleName}</td>
            <td>${item.distance.toFixed(4)}</td>
            <td style="font-size:11px;">${calc}</td>
        </tr>`;
    });

    html += `</table>`;

    // 投票统计
    html += `<p style="margin-top:15px;"><strong>📝 K=${k} 近邻投票统计:</strong></p><ul>`;
    for (const [label, count] of Object.entries(result.voteCount)) {
        const name = labelNames[label] || `类别${label}`;
        html += `<li>${name}: ${count} 票</li>`;
    }
    html += `</ul>`;

    // 最终结果
    const finalLabel = labelNames[result.label];
    const finalClass = result.label === 0 ? 'apple' : 'banana';
    html += `<div class="final-result ${finalClass}">🍎 最终分类结果: <strong>${finalLabel}</strong></div>`;

    document.getElementById('distance-result').innerHTML = html;

    // 同时更新画布上的待测点
    state.testPoint = { [state.featureX]: x, [state.featureY]: y };
    updateVisualization();
}

// ============ 可视化 ============

function generateDecisionBoundary(data, resolution = 50, k = 5) {
    const xValues = data.map(p => p.x);
    const yValues = data.map(p => p.y);

    const xMin = Math.min(...xValues);
    const xMax = Math.max(...xValues);
    const yMin = Math.min(...yValues);
    const yMax = Math.max(...yValues);

    const xStep = (xMax - xMin) / resolution;
    const yStep = (yMax - yMin) / resolution;

    const grid = [];

    for (let i = 0; i < resolution; i++) {
        const row = [];
        for (let j = 0; j < resolution; j++) {
            const x = xMin + (i + 0.5) * xStep;
            const y = yMin + (j + 0.5) * yStep;
            const prediction = knn_predict({x, y}, data, k);
            row.push(prediction.label);
        }
        grid.push(row);
    }

    return { grid, xRange: [xMin, xMax], yRange: [yMin, yMax] };
}

function plotDecisionBoundary() {
    const dataset = DATASETS[state.currentDataset];
    const featureLabels = dataset.featureLabels;
    const data = getCurrentFeatureData(dataset.data, state.featureX, state.featureY);

    const processedData = state.normalized ? minMaxNormalizeSelected(data, state.featureX, state.featureY) : data;
    const {grid, xRange, yRange} = generateDecisionBoundary(processedData, 50, state.k);

    const boundaryTrace = {
        x: [], y: [], z: [], type: 'heatmap',
        colorscale: [[0, 'rgba(135, 206, 250, 0.6)'], [0.5, 'rgba(240, 128, 128, 0.3)'], [1, 'rgba(240, 128, 128, 0.6)']],
        showscale: false,
        x0: xRange[0], dx: (xRange[1] - xRange[0]) / 50,
        y0: yRange[0], dy: (yRange[1] - yRange[0]) / 50
    };

    for (let i = 0; i < grid.length; i++) {
        for (let j = 0; j < grid[i].length; j++) {
            boundaryTrace.x.push(xRange[0] + (i + 0.5) * (xRange[1] - xRange[0]) / 50);
            boundaryTrace.y.push(yRange[0] + (j + 0.5) * (yRange[1] - yRange[0]) / 50);
            boundaryTrace.z.push(grid[i][j]);
        }
    }

    return boundaryTrace;
}

function plotScatter() {
    const dataset = DATASETS[state.currentDataset];
    const data = getCurrentFeatureData(dataset.data, state.featureX, state.featureY);
    const processedData = state.normalized ? minMaxNormalizeSelected(data, state.featureX, state.featureY) : data;

    const traces = {};
    processedData.forEach(point => {
        const name = dataset.labels ? dataset.labels[point.label] : `类别 ${point.label}`;
        if (!traces[point.label]) {
            traces[point.label] = {x: [], y: [], mode: 'markers', name};
        }
        traces[point.label].x.push(point.x);
        traces[point.label].y.push(point.y);
    });

    return Object.values(traces);
}

function updateVisualization() {
    const dataset = DATASETS[state.currentDataset];
    const featureLabels = dataset.featureLabels;

    const boundaryTrace = plotDecisionBoundary();
    const scatterTraces = plotScatter();

    const xLabel = featureLabels[state.featureX] || state.featureX;
    const yLabel = featureLabels[state.featureY] || state.featureY;

    const layout = {
        title: `${dataset.name} - KNN决策边界 (K=${state.k})`,
        xaxis: {title: xLabel},
        yaxis: {title: yLabel},
        dragmode: 'pan',
        margin: {t: 60, r: 20, b: 60, l: 60}
    };

    if (state.testPoint) {
        const data = getCurrentFeatureData(dataset.data, state.featureX, state.featureY);
        const processedData = state.normalized ? minMaxNormalizeSelected(data, state.featureX, state.featureY) : data;

        const testPoint2D = {
            x: state.testPoint[state.featureX],
            y: state.testPoint[state.featureY]
        };

        const prediction = knn_predict(testPoint2D, processedData, state.k);
        state.neighbors = prediction.neighbors;

        const testPointTrace = {
            x: [testPoint2D.x], y: [testPoint2D.y],
            mode: 'markers', marker: {symbol: 'star', size: 20, color: 'green'},
            name: '待测点'
        };

        const neighborTraces = prediction.neighbors.map((n, i) => ({
            x: [testPoint2D.x, n.point.x], y: [testPoint2D.y, n.point.y],
            mode: 'lines', line: {color: 'green', width: 1},
            opacity: 0.5 - i * 0.05, name: `邻居 ${i+1}`, showlegend: false
        }));

        Plotly.newPlot('scatter-plot', [boundaryTrace, ...scatterTraces, testPointTrace, ...neighborTraces], layout);
        updatePredictionResult(prediction);
    } else {
        Plotly.newPlot('scatter-plot', [boundaryTrace, ...scatterTraces], layout);
    }
}

function updatePredictionResult(prediction) {
    const resultDiv = document.getElementById('prediction-details');
    const dataset = DATASETS[state.currentDataset];
    const featureLabels = dataset.featureLabels;
    const labelNames = dataset.labels || ['类别0', '类别1', '类别2'];

    let html = `<p><strong>预测类别:</strong> ${labelNames[prediction.label]}</p>`;
    html += `<p><strong>投票统计:</strong></p><ul>`;
    for (const [label, count] of Object.entries(prediction.voteCount)) {
        html += `<li>${labelNames[label]}: ${count} 票</li>`;
    }
    html += `</ul>`;
    html += `<p><strong>最近 ${state.k} 个邻居:</strong></p><ul>`;
    prediction.neighbors.forEach((n, i) => {
        const xLabel = featureLabels[state.featureX] || state.featureX;
        const yLabel = featureLabels[state.featureY] || state.featureY;
        html += `<li>邻居${i+1}: (${xLabel}=${n.point.x.toFixed(3)}, ${yLabel}=${n.point.y.toFixed(3)}) - 距离: ${n.distance.toFixed(4)}</li>`;
    });
    html += `</ul>`;

    resultDiv.innerHTML = html;
}

function updateTeachingNotes(datasetKey) {
    const dataset = DATASETS[datasetKey];
    const kValue = state.k;

    let html = `<h4>${dataset.name}</h4>`;
    html += `<p><strong>特征:</strong> ${dataset.features.map(f => dataset.featureLabels[f] || f).join(', ')}</p>`;
    html += `<p><strong>目的:</strong> ${dataset.description}</p>`;

    if (dataset.scaleIssue) {
        html += `<p style="color: #e65100;"><strong>注意:</strong> 未归一化时，特征尺度差异大，距离计算会被大值特征主导。</p>`;
    }

    html += `<hr><h4>K值对模型的影响</h4>`;
    if (kValue <= 3) {
        html += `<p>K值较小，模型复杂度高，容易过拟合，决策边界细碎。</p>`;
    } else if (kValue <= 10) {
        html += `<p>K值适中，模型复杂度适中，决策边界较为平滑。</p>`;
    } else {
        html += `<p>K值较大，模型简单，决策边界平滑，但可能欠拟合。</p>`;
    }

    document.getElementById('teaching-notes').innerHTML = html;
}

// ============ 初始化 ============

function loadDataset(datasetKey) {
    const dataset = DATASETS[datasetKey];
    state.currentDataset = datasetKey;
    state.testPoint = null;
    state.neighbors = [];

    updateFeatureSelectors();
    updateDataTable();
    updateVisualization();
    updateTeachingNotes(datasetKey);

    // 清空手动输入结果
    document.getElementById('distance-result').innerHTML = '';
    document.getElementById('input-x').value = '';
    document.getElementById('input-y').value = '';
}

function clearTestPoint() {
    state.testPoint = null;
    state.neighbors = [];
    updateVisualization();
    document.getElementById('prediction-details').innerHTML = '<p>点击画布添加待测点</p>';
    document.getElementById('distance-result').innerHTML = '';
}

document.addEventListener('DOMContentLoaded', function() {
    // 数据集选择
    document.getElementById('dataset-select').addEventListener('change', function(e) {
        loadDataset(e.target.value);
    });

    // 特征选择
    document.getElementById('feature-x-select').addEventListener('change', function(e) {
        state.featureX = e.target.value;
        state.testPoint = null;
        updateFeatureSelectors();
        updateVisualization();
        updateDataTable();
    });

    document.getElementById('feature-y-select').addEventListener('change', function(e) {
        state.featureY = e.target.value;
        state.testPoint = null;
        updateFeatureSelectors();
        updateVisualization();
        updateDataTable();
    });

    // 归一化开关
    document.getElementById('normalization-toggle').addEventListener('change', function(e) {
        state.normalized = e.target.checked;
        updateVisualization();
    });

    // K值滑块
    document.getElementById('k-slider').addEventListener('input', function(e) {
        state.k = parseInt(e.target.value);
        document.getElementById('k-value-display').textContent = state.k;
        debounceUpdateVisualization();
        updateTeachingNotes(state.currentDataset);
    });

    // 手动预测按钮
    document.getElementById('predict-btn').addEventListener('click', handleManualPrediction);

    // 回车键触发预测
    document.getElementById('input-x').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleManualPrediction();
    });
    document.getElementById('input-y').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleManualPrediction();
    });

    // 清空按钮
    document.getElementById('clear-btn').addEventListener('click', clearTestPoint);

    // 画布点击事件
    document.getElementById('scatter-plot').on('plotly_click', function(data) {
        const dataset = DATASETS[state.currentDataset];
        const clickedX = data.points[0].x;
        const clickedY = data.points[0].y;

        const rawData = getCurrentFeatureData(dataset.data, state.featureX, state.featureY);
        const processedData = state.normalized ? minMaxNormalizeSelected(rawData, state.featureX, state.featureY) : rawData;

        if (state.normalized) {
            const xValues = rawData.map(p => p.x);
            const yValues = rawData.map(p => p.y);
            const xMin = Math.min(...xValues), xMax = Math.max(...xValues);
            const yMin = Math.min(...yValues), yMax = Math.max(...yValues);

            state.testPoint = {
                [state.featureX]: clickedX * (xMax - xMin) + xMin,
                [state.featureY]: clickedY * (yMax - yMin) + yMin
            };
        } else {
            state.testPoint = {
                [state.featureX]: clickedX,
                [state.featureY]: clickedY
            };
        }

        updateVisualization();
    });

    // 初始加载
    loadDataset('fruit');
});
</script>
